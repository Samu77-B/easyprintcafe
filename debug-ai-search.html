<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Search Debug - Easy Print Cafe</title>
    <link rel="icon" type="image/png" href="brand/epcFav.png">
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .debug-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .test-area { margin: 1rem 0; }
        input { padding: 0.5rem; width: 300px; }
        button { padding: 0.5rem 1rem; margin-left: 0.5rem; }
        .response { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>AI Search Debug Tool</h1>
    
    <div class="debug-section">
        <h2>JavaScript File Loading Test</h2>
        <div id="js-loading-status"></div>
    </div>
    
    <div class="debug-section">
        <h2>AI Search Function Test</h2>
        <div class="test-area">
            <input type="text" id="testSearch" placeholder="Try: 'What do I need for a cafe?'" />
            <button onclick="testAISearch()">Test AI Search</button>
        </div>
        <div id="search-result" class="response"></div>
    </div>
    
    <div class="debug-section">
        <h2>Console Errors</h2>
        <div id="console-errors"></div>
    </div>
    
    <div class="debug-section">
        <h2>Available Functions</h2>
        <div id="available-functions"></div>
    </div>

    <script>
        // Capture console errors
        const originalError = console.error;
        const errors = [];
        console.error = function(...args) {
            errors.push(args.join(' '));
            originalError.apply(console, args);
        };

        // Test JavaScript file loading
        function checkJSLoading() {
            const status = document.getElementById('js-loading-status');
            
            // Check if ai-search.js is loaded
            if (typeof getAIResponse === 'function') {
                status.innerHTML = '<div class="success">✅ ai-search.js loaded successfully</div>';
            } else {
                status.innerHTML = '<div class="error">❌ ai-search.js not loaded or getAIResponse function not found</div>';
            }
            
            // Check if displayAIResponse is available
            if (typeof displayAIResponse === 'function') {
                status.innerHTML += '<div class="success">✅ displayAIResponse function available</div>';
            } else {
                status.innerHTML += '<div class="error">❌ displayAIResponse function not found</div>';
            }
        }
        
        // Test AI search functionality
        function testAISearch() {
            const searchInput = document.getElementById('testSearch');
            const resultDiv = document.getElementById('search-result');
            const searchTerm = searchInput.value.trim();
            
            if (!searchTerm) {
                resultDiv.innerHTML = '<div class="error">Please enter a search term</div>';
                return;
            }
            
            if (typeof getAIResponse === 'function') {
                try {
                    const response = getAIResponse(searchTerm);
                    resultDiv.innerHTML = `
                        <div class="success">✅ AI Search Working!</div>
                        <div><strong>Question:</strong> ${searchTerm}</div>
                        <div><strong>Response:</strong> ${response.text}</div>
                        <div><strong>Products Found:</strong> ${response.products ? response.products.length : 0}</div>
                    `;
                } catch (error) {
                    resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                }
            } else {
                resultDiv.innerHTML = '<div class="error">❌ getAIResponse function not available</div>';
            }
        }
        
        // Show available functions
        function showAvailableFunctions() {
            const functionsDiv = document.getElementById('available-functions');
            const functions = [];
            
            // Check for various functions that should be available
            const functionNames = [
                'getAIResponse',
                'displayAIResponse',
                'productDatabase'
            ];
            
            functionNames.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    functions.push(`<div class="success">✅ ${funcName}() - Available</div>`);
                } else if (typeof window[funcName] === 'object') {
                    functions.push(`<div class="success">✅ ${funcName} - Object Available</div>`);
                } else {
                    functions.push(`<div class="error">❌ ${funcName} - Not Available</div>`);
                }
            });
            
            functionsDiv.innerHTML = functions.join('');
        }
        
        // Show console errors
        function showConsoleErrors() {
            const errorsDiv = document.getElementById('console-errors');
            if (errors.length > 0) {
                errorsDiv.innerHTML = '<div class="error">❌ Console Errors:<br>' + errors.join('<br>') + '</div>';
            } else {
                errorsDiv.innerHTML = '<div class="success">✅ No console errors detected</div>';
            }
        }
        
        // Initialize debug tool
        document.addEventListener('DOMContentLoaded', function() {
            // Load the AI search script
            const script = document.createElement('script');
            script.src = 'js/ai-search.js';
            script.onload = function() {
                console.log('AI search script loaded successfully');
                checkJSLoading();
                showAvailableFunctions();
                showConsoleErrors();
            };
            script.onerror = function() {
                console.error('Failed to load ai-search.js');
                document.getElementById('js-loading-status').innerHTML = 
                    '<div class="error">❌ Failed to load js/ai-search.js - Check file path</div>';
            };
            document.head.appendChild(script);
            
            // Allow Enter key in search
            document.getElementById('testSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    testAISearch();
                }
            });
        });
    </script>
</body>
</html>
