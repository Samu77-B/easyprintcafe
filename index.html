<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Easy Print Cafe</title>
    <meta name="description" content="Easy Print Cafe is brewing. We make printing as easy as buying your morning coffee.">
    <link rel="icon" type="image/png" href="brand/epcFav.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #597525;
            --green-light: #8eb442;
            --orange: #D64518;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--white);
            background: linear-gradient(145deg, #3f5618 0%, var(--green) 45%, var(--green-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .coming-soon {
            width: 100%;
            max-width: 640px;
            text-align: center;
        }

        .logo {
            display: block;
            width: min(360px, 82vw);
            height: auto;
            margin: 0 auto 2.5rem;
        }

        h1 {
            font-size: clamp(2.4rem, 8vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: clamp(1.05rem, 2.8vw, 1.3rem);
            font-weight: 500;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.92);
            margin-bottom: 2.25rem;
        }

        .contact {
            display: inline-block;
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.85rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 10px;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .contact:hover,
        .contact:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--white);
        }
    </style>
</head>
<body>
    <main class="coming-soon">
        <img class="logo" src="brand/epc - desktop - white.png" alt="Easy Print Cafe">
        <h1>Coming soon</h1>
        <p class="tagline">We make printing as easy as buying your morning coffee.</p>
        <a class="contact" href="mailto:hello@easyprintcafe.com">hello@easyprintcafe.com</a>
    </main>
</body>
</html>
